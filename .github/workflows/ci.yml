name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]" -c .github/constraints-ci.txt

      - name: Verify CPU test environment
        run: python -c "import numpy, requests, torch; assert torch.version.cuda is None, torch.__version__"

      - name: Run pytest
        run: python -m pytest

      - name: Run ruff
        run: python -m ruff check .
