[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roco"
version = "0.1.0"
description = "格斗小九 — Battle VM as a Platform: programmable turn-based sprite battle SDK"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BIGRUSH123"},
]
readme = "README.md"
keywords = ["battle", "simulation", "ai", "turn-based", "genetic-algorithm", "pokemon-like"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
ga = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/BIGRUSH123/Roco-littleNine"

[tool.setuptools.packages.find]
include = ["roco*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "roco/tests", "backend"]
addopts = "-x --tb=short"
