[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roco"
version = "1.0.0"
description = "格斗小九 — 洛克王国 PVP 对战模拟器"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BIGRUSH123"},
]
readme = "README.md"
keywords = ["roco", "battle", "pvp", "simulator", "turn-based", "洛克王国"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/BIGRUSH123/Roco-littleNine"

[tool.setuptools.packages.find]
include = ["roco*"]

[tool.ruff]
target-version = "py310"
line-length = 210

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E402",   # module-import-not-at-top-of-file: intentional for sys.path scripts
    "SIM102", # collapsible-if: style only
    "SIM108", # if-else-block-instead-of-if-exp: style only
    "SIM116", # if-else-block-instead-of-dict-lookup: style only
    "N806",   # non-lowercase-variable-in-function: L in formulas is conventional
    "N814",   # camelcase-imported-as-constant: test aliases
    "N805",   # invalid-first-argument-name-for-method: _self in inner classes
    "B007",   # unused-loop-control-variable: minor
    "B023",   # function-uses-loop-variable: minor
    "UP007",  # non-pep604-annotation-union: py3.10 compat
]

[tool.ruff.lint.per-file-ignores]
"wiki/**" = ["E501"]  # scraper has long strings
"_debug_trait_tooltip.py" = ["E501", "F841", "SIM"]  # debug script
"backend/engine/test_*.py" = ["E501", "N814", "N805", "B011", "F841", "B017", "N802", "N806"]  # test files
"backend/tools/**" = ["E501", "F841", "F821"]  # dev tools
"backend/api/main.py" = ["E501"]  # API routes have long strings
"__init__.py" = ["F401"]  # re-exports
"**/test_*.py" = ["E501", "F401", "F841", "B017"]  # all test files
"**/tests/**" = ["E501", "F401", "F841", "B017"]  # all test directories
"roco/**" = ["E501", "F841", "SIM"]  # package

[tool.pytest.ini_options]
testpaths = ["tests", "roco/tests", "backend"]
addopts = "-x --tb=short"
filterwarnings = [
    "ignore:The PyTorch API of nested tensors is in prototype stage.*:UserWarning",
]
